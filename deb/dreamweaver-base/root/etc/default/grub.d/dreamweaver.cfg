# Sourced after /etc/default/grub, so these keys win over it.
# GRUB_CMDLINE_LINUX is left to whoever installed, as install.d/120-grub explains.
GRUB_DISTRIBUTOR=Dreamweaver
GRUB_DEFAULT=0
GRUB_TIMEOUT=0
GRUB_CMDLINE_LINUX_DEFAULT="quiet"
GRUB_DISABLE_OS_PROBER=true
GRUB_BACKGROUND=/boot/grub/dreamweaver.jpg
