# Seed for the published image: locale, keyboard, partitioning and accounts are left to
# whoever installs it, and only what makes it a Dreamweaver install is set. The boot tests
# use preseed/unattended.cfg instead.

# No tasks, so no desktop environment
tasksel tasksel/first multiselect

# No software selection prompt
d-i pkgsel/upgrade select full-upgrade

# Asks which profile to install, early, before partitioning. It fails soft on purpose,
# for the reason preseed/profile-select gives.
d-i preseed/early_command string /profile-select

# late-command comes from the initrd, which debian-installer picks up with no boot
# parameter. The payload comes off the medium when embedded, and late-command falls back to
# a signed download when it is not.
#
# --export runs in the installer, where the answers live. late-command runs in the target,
# which has its own debconf database and cannot see them.
d-i preseed/late_command string \
	mv /late-command /target/root/; \
	/profile-select --export /target/root/dreamweaver.profile || true; \
	if [ -f /cdrom/dreamweaver.tar.gz ]; then \
		cp /cdrom/dreamweaver.tar.gz /target/root/; \
	fi; \
	in-target /bin/sh /root/late-command
