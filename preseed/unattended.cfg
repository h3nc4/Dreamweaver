# Unattended seed for scripts/test-install.sh. Never published: the credentials are
# throwaway and this wipes /dev/vda without asking.
#
# cook-image.sh -t appends the matching preseed/mirror-*.cfg.

# No tasks, so no desktop environment
tasksel tasksel/first multiselect

# No software selection prompt
d-i pkgsel/upgrade select full-upgrade

d-i auto-install/enable boolean true

d-i debian-installer/language string en_US:en
d-i debian-installer/country string BR
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select br

# The boot test reads the serial console to tell a booted system from a black screen, so
# the installed kernel has to talk to it.
d-i debian-installer/add-kernel-opts string console=ttyS0,115200n8

d-i netcfg/disable_autoconfig boolean false
d-i hw-detect/load_firmware boolean false
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/hostname string
d-i netcfg/get_hostname string dreamweaver
d-i netcfg/get_domain string local

# Throwaway credentials for a throwaway VM.
d-i passwd/root-login boolean true
d-i passwd/root-password password root
d-i passwd/root-password-again password root
d-i passwd/make-user boolean true
d-i passwd/user-fullname string
d-i passwd/username string h3nc4
d-i passwd/user-password password h3nc4
d-i passwd/user-password-again password h3nc4

popularity-contest popularity-contest/participate boolean false

# Without these the install stops at "Scan extra installation media?" waiting for a
# keypress that never comes, found by watching one sit at 7% CPU for forty-seven minutes.
#
# Answered explicitly rather than with debconf/priority critical, which would silence the
# profile question too and hide the next missing answer instead of surfacing it.
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/another boolean false
# Does not reliably remove the "deb cdrom:" line, so ./bootstrap strips it instead.
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/services-select multiselect security, updates

# Devuan only: its choose-init udeb asks which init to install, so an unattended Devuan
# install stops where Debian sails past. Template read off the ISO, not guessed.
#
# Absent from preseed/default.cfg on purpose: choosing an init is the point of Devuan, so a
# published image lets whoever installs it decide.
choose-init choose-init/select_init select sysvinit

d-i clock-setup/utc boolean true
d-i time/zone string America/Sao_Paulo
d-i clock-setup/ntp boolean true

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# The UEFI boot test starts from a clean OVMF variable store, as a machine booting a USB
# stick first does, so the loader must exist at the removable media path too.
d-i grub-installer/force-efi-extra-removable boolean true
d-i grub-installer/progress/step_force_efi_removable boolean true

d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-efi/non_efi_system boolean true

d-i finish-install/reboot_in_progress note

# The profile question, answered ahead of time: preseeding sets debconf's seen flag, so
# db_input skips it. Both images run the same script, and only this one stays silent.
dreamweaver dreamweaver/session select xorg
dreamweaver dreamweaver/extras multiselect development

d-i preseed/early_command string /profile-select

d-i preseed/late_command string \
	mv /late-command /target/root/; \
	/profile-select --export /target/root/dreamweaver.profile || true; \
	if [ -f /cdrom/dreamweaver.tar.gz ]; then \
		cp /cdrom/dreamweaver.tar.gz /target/root/; \
	fi; \
	in-target /bin/sh /root/late-command
