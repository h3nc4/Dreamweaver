# Appended to preseed/unattended.cfg by `cook-image.sh -d devuan -t`.
# A host from mirrors/devuan.list, over http since Devuan's choose-mirror has no mirror/https/* templates.
# It must serve /merged at the root, because Devuan's apt-setup 91security writes http://<host>/merged.
d-i mirror/protocol string http
d-i mirror/country string manual
d-i mirror/http/hostname string devuan.dcc.uchile.cl
d-i mirror/http/directory string /merged/
d-i mirror/http/proxy string
