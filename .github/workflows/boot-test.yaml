name: Dreamweaver Boot Test

# Installs an image unattended under QEMU and boots the result, once per firmware.
# verify-iso.sh catches a broken boot catalog. This catches everything downstream of it.
#
# Needs KVM and takes tens of minutes, so it runs apart from the main CI.

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "scripts/cook-image.sh"
      - "preseed/**"
      - "scripts/test-install.sh"
      - "scripts/verify-iso.sh"
      - "install"
      - "install.d/**"
      - "lib/**"
      - "bootstrap"
      - "packages/**"
      - ".github/workflows/boot-test.yaml"
  pull_request:
    branches:
      - "master"
    paths:
      - "scripts/cook-image.sh"
      - "preseed/**"
      - "scripts/test-install.sh"
      - "scripts/verify-iso.sh"
      - "install"
      - "install.d/**"
      - "lib/**"
      - "bootstrap"
      - "packages/**"
      - ".github/workflows/boot-test.yaml"

jobs:
  dev-image:
    name: Resolve Dev Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.dev.outputs.image }}
      artifact: ${{ steps.dev.outputs.artifact }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run h3nc4/dev-image-action/share
        id: dev
        uses: h3nc4/dev-image-action/share@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3

  profile:
    name: Profile question on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: [dev-image]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ needs.dev-image.outputs.image }}
          artifact: ${{ needs.dev-image.outputs.artifact }}
          base-sha: ""
      - name: Confirm the runner has KVM
        run: test -e /dev/kvm
      - name: Build the unattended test image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}" -t
      # Seconds once the image exists: it stops at the line under test.
      - name: Test the profile question
        run: |
          docker run --rm \
            --device /dev/kvm \
            -v "${PWD}:/workspaces/Dreamweaver" \
            -w /workspaces/Dreamweaver \
            --entrypoint /workspaces/Dreamweaver/scripts/test-profile.sh \
            --user root \
            "${{ needs.dev-image.outputs.image }}" \
            "$(printf '%s\n' dreamweaver-${{ matrix.distro }}-*.iso)"
      - name: Run actions/upload-artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: profile-test-${{ matrix.distro }}
          path: scratch/profile-test/*.txt
          retention-days: 7
          if-no-files-found: ignore

  interactive:
    name: Interactive install on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: [dev-image]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ needs.dev-image.outputs.image }}
          artifact: ${{ needs.dev-image.outputs.artifact }}
          base-sha: ""
      - name: Confirm the runner has KVM
        run: test -e /dev/kvm
      - name: Build the unattended test image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}" -t
      # Answers the dialogue for real, with values other than the defaults, and checks
      # what the answers became.
      - name: Answer the installer
        run: |
          docker run --rm \
            --device /dev/kvm \
            -v "${PWD}:/workspaces/Dreamweaver" \
            -w /workspaces/Dreamweaver \
            --entrypoint /workspaces/Dreamweaver/scripts/test-interactive.sh \
            --user root \
            "${{ needs.dev-image.outputs.image }}" \
            -s headless -e "development gaming" \
            "$(printf '%s\n' dreamweaver-${{ matrix.distro }}-*.iso)"
      - name: Run actions/upload-artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interactive-test-${{ matrix.distro }}
          path: |
            scratch/interactive-test/*.log
            scratch/interactive-test/seed.cfg
          retention-days: 7
          if-no-files-found: ignore

  install:
    name: ${{ matrix.distro }} on ${{ matrix.firmware }}
    runs-on: ubuntu-latest
    needs: [dev-image]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
        firmware: [bios, uefi]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ needs.dev-image.outputs.image }}
          artifact: ${{ needs.dev-image.outputs.artifact }}
          base-sha: ""
      - name: Confirm the runner has KVM
        run: test -e /dev/kvm
      - name: Build the unattended test image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}" -t
      - name: Install and boot
        run: |
          docker run --rm \
            --device /dev/kvm \
            -v "${PWD}:/workspaces/Dreamweaver" \
            -w /workspaces/Dreamweaver \
            --entrypoint /workspaces/Dreamweaver/scripts/test-install.sh \
            --user root \
            "${{ needs.dev-image.outputs.image }}" \
            -f "${{ matrix.firmware }}" \
            "$(printf '%s\n' dreamweaver-${{ matrix.distro }}-*.iso)"
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: boot-test-${{ matrix.distro }}-${{ matrix.firmware }}
          path: |
            scratch/boot-test/*.log
            scratch/boot-test/*.ppm
          retention-days: 7
          if-no-files-found: ignore

  dev-image-cleanup:
    name: Clean Up Dev Image
    needs: [dev-image, profile, interactive, install]
    if: always() && needs.dev-image.outputs.artifact != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run h3nc4/dev-image-action/cleanup
        uses: h3nc4/dev-image-action/cleanup@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          artifact: ${{ needs.dev-image.outputs.artifact }}
