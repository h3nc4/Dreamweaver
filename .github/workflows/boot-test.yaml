name: Dreamweaver Boot Test

# Installs an image unattended under QEMU and boots the result, once per firmware.
# verify-iso.sh catches a broken boot catalog. This catches everything downstream of it.
#
# Needs KVM and takes tens of minutes, so it runs apart from the main CI.

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "scripts/cook-image.sh"
      - "preseed/**"
      - "scripts/test-install.sh"
      - "scripts/verify-iso.sh"
      - "install"
      - "install.d/**"
      - "lib/**"
      - "bootstrap"
      - "packages/**"
      - ".github/workflows/boot-test.yaml"
  pull_request:
    branches:
      - "master"
    paths:
      - "scripts/cook-image.sh"
      - "preseed/**"
      - "scripts/test-install.sh"
      - "scripts/verify-iso.sh"
      - "install"
      - "install.d/**"
      - "lib/**"
      - "bootstrap"
      - "packages/**"
      - ".github/workflows/boot-test.yaml"

jobs:
  prepare:
    name: Prepare environment
    runs-on: ubuntu-latest
    outputs:
      dev-image: ${{ steps.dev_image.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: dev_image
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  profile:
    name: Profile question on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Run docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Confirm the runner has KVM
        run: test -e /dev/kvm
      - name: Build the unattended test image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}" -t
      # Seconds once the image exists: it stops at the line under test.
      - name: Test the profile question
        run: |
          docker run --rm \
            --device /dev/kvm \
            -v "${PWD}:/workspaces/Dreamweaver" \
            -w /workspaces/Dreamweaver \
            --entrypoint /workspaces/Dreamweaver/scripts/test-profile.sh \
            --user root \
            "${{ needs.prepare.outputs.dev-image }}" \
            "$(printf '%s\n' dreamweaver-${{ matrix.distro }}-*.iso)"
      - name: Run actions/upload-artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-test-${{ matrix.distro }}
          path: scratch/profile-test/*.txt
          retention-days: 7
          if-no-files-found: ignore

  interactive:
    name: Interactive install on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Run docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Confirm the runner has KVM
        run: test -e /dev/kvm
      - name: Build the unattended test image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}" -t
      # Answers the dialogue for real, with values other than the defaults, and checks
      # what the answers became.
      - name: Answer the installer
        run: |
          docker run --rm \
            --device /dev/kvm \
            -v "${PWD}:/workspaces/Dreamweaver" \
            -w /workspaces/Dreamweaver \
            --entrypoint /workspaces/Dreamweaver/scripts/test-interactive.sh \
            --user root \
            "${{ needs.prepare.outputs.dev-image }}" \
            -s wayland -e "development gaming" \
            "$(printf '%s\n' dreamweaver-${{ matrix.distro }}-*.iso)"
      - name: Run actions/upload-artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: interactive-test-${{ matrix.distro }}
          path: |
            scratch/interactive-test/*.log
            scratch/interactive-test/seed.cfg
          retention-days: 7
          if-no-files-found: ignore

  install:
    name: ${{ matrix.distro }} on ${{ matrix.firmware }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
        firmware: [bios, uefi]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Run docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Confirm the runner has KVM
        run: test -e /dev/kvm
      - name: Build the unattended test image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}" -t
      - name: Install and boot
        run: |
          docker run --rm \
            --device /dev/kvm \
            -v "${PWD}:/workspaces/Dreamweaver" \
            -w /workspaces/Dreamweaver \
            --entrypoint /workspaces/Dreamweaver/scripts/test-install.sh \
            --user root \
            "${{ needs.prepare.outputs.dev-image }}" \
            -f "${{ matrix.firmware }}" \
            "$(printf '%s\n' dreamweaver-${{ matrix.distro }}-*.iso)"
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boot-test-${{ matrix.distro }}-${{ matrix.firmware }}
          path: |
            scratch/boot-test/*.log
            scratch/boot-test/*.ppm
          retention-days: 7
          if-no-files-found: ignore
