name: Dreamweaver Development CI

on:
  push:
    branches:
      - "master"
      - "release/*"
  pull_request:
    branches:
      - "master"
      - "release/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request run is superseded by the pin push that lands seconds into it, so only one
  # full run is paid for. A run on master queues instead, so none of them is ever cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dev-image:
    name: Resolve Dev Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.dev.outputs.image }}
      artifact: ${{ steps.dev.outputs.artifact }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      # Authenticated pulls, which anonymous rate limits can refuse.
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run h3nc4/dev-image-action/share
        id: dev
        uses: h3nc4/dev-image-action/share@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3

  checks:
    name: Validate Codebase
    needs: [dev-image]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Authenticated pulls, which anonymous rate limits can refuse.
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ needs.dev-image.outputs.image }}
          artifact: ${{ needs.dev-image.outputs.artifact }}
          base-sha: ""
      - name: Lint shell and prose
        run: $DEV_RUN -c './scripts/ci.sh'
      - name: Build and lint packages
        run: $DEV_RUN -c './scripts/build-debs.sh && lintian --pedantic dist/*.deb'
      # Was its own workflow that only built the image. Here it runs against whichever
      # image the suite uses, candidate included, and the signing keys are fetched at
      # image build time, so that failure surfaces before a release.
      - name: Check the toolchain the image promises
        run: |
          $DEV_RUN -c 'set -e
            for tool in xorriso cpio gzip curl gpg shellcheck shfmt \
                        qemu-system-x86_64 qemu-img socat websockify dpkg-deb lintian; do
              command -v "${tool}" >/dev/null || { echo "missing ${tool}" >&2; exit 1; }
            done
            test -s "${DREAMWEAVER_KEYS}/debian.asc"
            test -s "${DREAMWEAVER_KEYS}/devuan.asc"
            ls /usr/share/OVMF/OVMF_CODE_4M.fd >/dev/null
            # scripts/vm.sh serves this to the browser, so websockify alone is not enough.
            test -s /usr/share/novnc/vnc.html'

  modules:
    name: install.d on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every module twice, in a container of the target base. Minutes against the tens a
      # full VM install costs, which is why this gates every push and boot-test.yaml does
      # not.
      - name: Run the module suite
        run: ./scripts/test-modules.sh -d "${{ matrix.distro }}"

  build:
    name: Build ${{ matrix.distro }} image
    needs: [dev-image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Authenticated pulls, which anonymous rate limits can refuse.
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ needs.dev-image.outputs.image }}
          artifact: ${{ needs.dev-image.outputs.artifact }}
          base-sha: ""
      # A pull request pins a tag published only after its merge, which the shared candidate
      # already carries. No buildx builder runs, whose container would not see a local image.
      - name: Read the pinned dev image
        id: dev_image
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"
      - name: Build image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}"
      # cook-image.sh already ran this. Outside the build container it proves the artifact
      # that left the build is the one that passed.
      - name: Verify boot layout
        run: |
          docker run --rm \
            -v "${PWD}:/iso:ro" \
            --entrypoint /iso/scripts/verify-iso.sh \
            "${{ steps.dev_image.outputs.ref }}" \
            "$(printf '/iso/%s\n' dreamweaver-*-${{ matrix.distro }}-amd64.iso)"

  dev-image-cleanup:
    name: Clean Up Dev Image
    needs: [dev-image, checks, build]
    if: always() && needs.dev-image.outputs.artifact != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run h3nc4/dev-image-action/cleanup
        uses: h3nc4/dev-image-action/cleanup@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          artifact: ${{ needs.dev-image.outputs.artifact }}
