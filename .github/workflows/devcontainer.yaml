name: Dreamweaver Dev Container

on:
  pull_request:
    branches:
      - "master"
    paths:
      - "docker/dev.Dockerfile"
      - "scripts/entrypoint.sh"
      - "scripts/switch-user.sh"
  push:
    branches:
      - "master"
    paths:
      - "docker/dev.Dockerfile"
      - "scripts/entrypoint.sh"
      - "scripts/switch-user.sh"
      - ".devcontainer.json"
  workflow_dispatch:

jobs:
  bump:
    name: Pin the next dev container
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-bump-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # pushes the pin to this pull request's branch
    steps:
      # Pushed as the app rather than with the job token. A GITHUB_TOKEN push starts no
      # workflow run, so the pin became a head with no checks a required check could land on.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "4811373" # the automerge app, whose key is already a secret here
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Run h3nc4/dev-image-pin-action/bump
        uses: h3nc4/dev-image-pin-action/bump@5285ae65244f774826b618fa3aed08d257ac06e8 # v1
        with:
          image-inputs: docker/dev.Dockerfile scripts/entrypoint.sh scripts/switch-user.sh

  release:
    name: Publish the pinned dev container
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release
    permissions:
      contents: read
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
      - name: Run docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run h3nc4/dev-image-pin-action/release
        uses: h3nc4/dev-image-pin-action/release@5285ae65244f774826b618fa3aed08d257ac06e8 # v1
        with:
          image-inputs: docker/dev.Dockerfile scripts/entrypoint.sh scripts/switch-user.sh
