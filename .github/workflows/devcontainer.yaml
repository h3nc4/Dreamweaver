name: Dreamweaver Dev Container

on:
  pull_request:
    branches:
      - "master"
    paths:
      - "docker/dev.Dockerfile"
      - "scripts/entrypoint.sh"
      - "scripts/switch-user.sh"
  push:
    branches:
      - "master"
    paths:
      - "docker/dev.Dockerfile"
      - "scripts/entrypoint.sh"
      - "scripts/switch-user.sh"
      - ".devcontainer.json"
  workflow_dispatch:

jobs:
  bump:
    name: Pin the next dev container
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-bump-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # pushes the pin to this pull request's branch
    steps:
      # Pushed as the app rather than with the job token. A GITHUB_TOKEN push starts no
      # workflow run, so the pin became a head with no checks a required check could land on.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "4811373" # the automerge app, whose key is already a secret here
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Take the next version from the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --quiet --depth=1 origin "${BASE_REF}"
          pin="$(git show FETCH_HEAD:.devcontainer.json)"
          repo="$(printf '%s\n' "${pin}" | scripts/devcontainer-image.sh -r -)"
          base_id="$(printf '%s\n' "${pin}" | scripts/devcontainer-image.sh -t -)"
          case "${base_id}" in # Leading zeroes are not allowed
            "" | *[!0-9]* | 0?*)
              echo "::error::bad image id '${base_id}' on ${BASE_REF}"
              exit 1
              ;;
          esac
          {
            echo "IMAGE_REPO=${repo}"
            echo "VERSION=$(( base_id + 1 ))"
          } >>"${GITHUB_ENV}"
      - name: Move the pin
        run: |
          sed -i \
            "s|\(\"image\"[[:space:]]*:[[:space:]]*\"${IMAGE_REPO}\):[^\"]*\"|\1:${VERSION}\"|" \
            .devcontainer.json
          if ! grep -q "\"${IMAGE_REPO}:${VERSION}\"" .devcontainer.json; then
            echo "::error::.devcontainer.json does not pin ${IMAGE_REPO}:${VERSION}." \
              "Its image key has to name the same repository as the base branch does."
            exit 1
          fi
      - name: Commit and push the pin
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- .devcontainer.json; then
            echo "::notice::already pinned to ${IMAGE_REPO}:${VERSION}"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "Bump dev container to ${VERSION}" -- .devcontainer.json
          git push origin "HEAD:${HEAD_REF}"

  release:
    name: Publish and tag the pinned dev container
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release
    permissions:
      contents: write # creates the dc-v tag
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0 # fetch all history so the tag check can see them
      - name: Read the pin
        run: |
          {
            echo "IMAGE_REPO=$(scripts/devcontainer-image.sh -r)"
            echo "VERSION=$(scripts/devcontainer-image.sh -t)"
          } >>"${GITHUB_ENV}"
      - name: Decide whether this pin still needs releasing
        run: |
          tag="dc-v${VERSION}"
          echo "SOURCE_TAG=${tag}" >>"${GITHUB_ENV}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "RELEASE=yes" >>"${GITHUB_ENV}"
            exit 0
          fi
          echo "RELEASE=no" >>"${GITHUB_ENV}"
          changed="$(git diff --name-only "${tag}" HEAD -- \
            docker/dev.Dockerfile scripts/entrypoint.sh scripts/switch-user.sh)"
          if [ -n "${changed}" ]; then
            echo "::error::the pin is still ${VERSION}, which ${tag} already released, but" \
              "these moved since: $(echo "${changed}" | tr '\n' ' '). Open a pull request so" \
              "the bump lands in the same commit as the change."
            exit 1
          fi
          echo "::notice::${tag} is released and nothing has moved since, so there is nothing to do"
      - name: Run docker/setup-buildx-action
        if: env.RELEASE == 'yes'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Run docker/login-action
        if: env.RELEASE == 'yes'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run docker/build-push-action
        if: env.RELEASE == 'yes'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/dev.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION }}
            ${{ env.IMAGE_REPO }}:latest
      - name: Tag the commit that carries the change, the pin and the image
        if: env.RELEASE == 'yes'
        run: |
          git tag "${SOURCE_TAG}"
          git push origin "${SOURCE_TAG}"
          echo "::notice::tagged $(git rev-parse --short HEAD) as ${SOURCE_TAG}"
