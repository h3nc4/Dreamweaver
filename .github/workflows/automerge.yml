name: Automerge Renovate

on:
  workflow_run:
    workflows:
      - Dreamweaver Boot Test
      - Dreamweaver Development CI
      - Security Analysis
    types:
      - completed

permissions: {}

jobs:
  automerge:
    name: Merge if CI passed
    if: >-
      contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run h3nc4/renovate-automerge-action
        uses: h3nc4/renovate-automerge-action@85f5e01a14bba7c55244f318f5596d294853e0d6 # v1
        with:
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
