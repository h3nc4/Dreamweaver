name: Dreamweaver Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  check-tag-branch:
    name: Check Tag Location
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag is on master branch
        run: git merge-base --is-ancestor ${{ github.sha }} origin/master
      # VERSION names every artifact, so a tag that disagrees with it would publish files
      # named after another release.
      - name: Verify tag matches VERSION
        run: |
          if [ "${GITHUB_REF_NAME}" != "v$(cat VERSION)" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"
            exit 1
          fi

  prepare:
    name: Prepare environment
    runs-on: ubuntu-latest
    needs: check-tag-branch
    outputs:
      version: ${{ steps.version.outputs.version }}
      dev-image: ${{ steps.dev_image.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        run: echo "version=$(cat VERSION)" >>"${GITHUB_OUTPUT}"
      - id: dev_image
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  payload:
    name: Build and Sign Payload
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Import gpg key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      # Still published and signed: `cook-image.sh -n` images and the README's
      # install-on-a-running-system path both fetch it.
      - name: Tar and sign
        run: |
          ./scripts/make-tar.sh
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor \
            -o dreamweaver.tar.gz.asc dreamweaver.tar.gz
          gpg --verify dreamweaver.tar.gz.asc dreamweaver.tar.gz
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: payload
          path: |
            dreamweaver.tar.gz
            dreamweaver.tar.gz.asc
          retention-days: 1

  images:
    name: Build and Sign ${{ matrix.distro }} Image
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
    env:
      ISO: dreamweaver-${{ needs.prepare.outputs.version }}-${{ matrix.distro }}-amd64.iso
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Authenticated pulls, which anonymous rate limits can refuse.
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}"
      # Nothing is signed before this passes: a published image no UEFI machine can boot
      # is the failure it exists for.
      - name: Verify boot layout
        run: |
          docker run --rm \
            -v "${PWD}:/iso:ro" \
            --entrypoint /iso/scripts/verify-iso.sh \
            "${{ needs.prepare.outputs.dev-image }}" \
            "/iso/${ISO}"
      - name: Import gpg key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Sign image
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor -o "${ISO}.asc" "${ISO}"
          gpg --verify "${ISO}.asc" "${ISO}"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-${{ matrix.distro }}
          path: |
            ${{ env.ISO }}
            ${{ env.ISO }}.asc
          retention-days: 1

  # The package list comes from a real install of the unattended test image, the only point
  # where the set the mirror resolves to is known.
  packages:
    name: List ${{ matrix.distro }} Packages
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Authenticated pulls, which anonymous rate limits can refuse.
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Confirm the runner has KVM
        run: test -e /dev/kvm
      - name: Build the unattended test image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}" -t
      - name: Install and boot
        run: |
          docker run --rm \
            --device /dev/kvm \
            -v "${PWD}:/workspaces/Dreamweaver" \
            -w /workspaces/Dreamweaver \
            --entrypoint /workspaces/Dreamweaver/scripts/test-install.sh \
            --user root \
            "${{ needs.prepare.outputs.dev-image }}" \
            -f uefi \
            "dreamweaver-${{ needs.prepare.outputs.version }}-${{ matrix.distro }}-amd64.iso"
      - name: Write the package source list
        run: |
          base="$(./scripts/cook-image.sh -d "${{ matrix.distro }}" -P)"
          flags="$(sed -n "s/^DW_INSTALL_FLAGS='\(.*\)'\$/\1/p" scratch/boot-test/uefi-packages.raw)"
          ./scripts/package-sources.sh \
            -t "Dreamweaver ${{ needs.prepare.outputs.version }} package sources, ${DISTRO_NAME} ${base}" \
            -p "${flags}" \
            scratch/boot-test/uefi-packages.txt \
            >"dreamweaver-${{ needs.prepare.outputs.version }}-${{ matrix.distro }}-packages.md"
        env:
          DISTRO_NAME: ${{ matrix.distro == 'debian' && 'Debian' || 'Devuan' }}
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.distro }}
          path: dreamweaver-${{ needs.prepare.outputs.version }}-${{ matrix.distro }}-packages.md
          retention-days: 1
      - name: Run actions/upload-artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-test-${{ matrix.distro }}
          path: |
            scratch/boot-test/*.log
            scratch/boot-test/*.raw
            scratch/boot-test/*.ppm
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, payload, images, packages]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The whole history, so the notes can find the previous tag.
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Confirm every artifact arrived signed
        run: |
          set -e
          test -s dist/dreamweaver.tar.gz
          test -s dist/dreamweaver.tar.gz.asc
          for distro in debian devuan; do
            test -s "dist/dreamweaver-${VERSION}-${distro}-amd64.iso"
            test -s "dist/dreamweaver-${VERSION}-${distro}-amd64.iso.asc"
            test -s "dist/dreamweaver-${VERSION}-${distro}-packages.md"
          done
      # Release assets cannot alias one another, so the README's latest/download links need
      # a real file under a name without the version.
      - name: Copy images to stable names
        run: |
          for distro in debian devuan; do
            cp "dist/dreamweaver-${VERSION}-${distro}-amd64.iso" "dist/dreamweaver-${distro}-amd64.iso"
            cp "dist/dreamweaver-${VERSION}-${distro}-amd64.iso.asc" "dist/dreamweaver-${distro}-amd64.iso.asc"
          done
      - name: Import gpg key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Sign package lists and checksums
        run: |
          set -e
          sign() {
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor -o "$1.asc" "$1"
            gpg --verify "$1.asc" "$1"
          }
          for list in dist/dreamweaver-*-packages.md; do
            sign "${list}"
          done
          (cd dist && sha256sum -- *) >SHA256SUMS
          mv SHA256SUMS dist/SHA256SUMS
          sign dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Write release notes
        run: ./scripts/release-notes.sh dist/* >release-notes.md
      - name: Run softprops/action-gh-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          body_path: release-notes.md
          files: dist/*
