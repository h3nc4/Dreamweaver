name: Dreamweaver Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  check-tag-branch:
    name: Check Tag Location
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag is on master branch
        run: git merge-base --is-ancestor ${{ github.sha }} origin/master

  prepare:
    name: Prepare environment
    runs-on: ubuntu-latest
    needs: check-tag-branch
    outputs:
      version: ${{ steps.version.outputs.version }}
      dev-image: ${{ steps.dev_image.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"
      - id: dev_image
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  payload:
    name: Build and Sign Payload
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Import gpg key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      # Still published and signed: `cook-image.sh -n` images and the README's
      # install-on-a-running-system path both fetch it.
      - name: Tar and sign
        run: |
          ./scripts/make-tar.sh
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor \
            -o dreamweaver.tar.gz.asc dreamweaver.tar.gz
          gpg --verify dreamweaver.tar.gz.asc dreamweaver.tar.gz
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: payload
          path: |
            dreamweaver.tar.gz
            dreamweaver.tar.gz.asc
          retention-days: 1

  images:
    name: Build and Sign ${{ matrix.distro }} Image
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, devuan]
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # Authenticated pulls, which anonymous rate limits can refuse.
      - name: Run docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: ./scripts/build-iso.sh -d "${{ matrix.distro }}"
      # Nothing is signed before this passes: a published image no UEFI machine can boot
      # is the failure it exists for.
      - name: Verify boot layout
        run: |
          docker run --rm \
            -v "${PWD}:/iso:ro" \
            --entrypoint /iso/scripts/verify-iso.sh \
            "${{ needs.prepare.outputs.dev-image }}" \
            "$(printf '/iso/%s\n' dreamweaver-${{ matrix.distro }}-*.iso)"
      - name: Import gpg key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Sign image
        run: |
          for iso in dreamweaver-${{ matrix.distro }}-*.iso; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor -o "${iso}.asc" "${iso}"
            gpg --verify "${iso}.asc" "${iso}"
          done
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{ matrix.distro }}
          path: |
            dreamweaver-${{ matrix.distro }}-*.iso
            dreamweaver-${{ matrix.distro }}-*.iso.asc
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [payload, images]
    permissions:
      contents: write
    steps:
      - name: Run actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
      - name: Confirm every artifact arrived signed
        run: |
          set -e
          test -s dreamweaver.tar.gz
          test -s dreamweaver.tar.gz.asc
          for distro in debian devuan; do
            iso="$(printf '%s\n' dreamweaver-"${distro}"-*.iso | head -n 1)"
            test -s "${iso}"
            test -s "${iso}.asc"
          done
      - name: Run softprops/action-gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            dreamweaver.tar.gz
            dreamweaver.tar.gz.asc
            dreamweaver-*.iso
            dreamweaver-*.iso.asc
